[workspace]
resolver = "3"
members = ["crates/*", "demos/*", "bench"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/better-vault/rust-use"
authors = ["Khalid Abdi"]
keywords = ["ui", "agents", "gpui", "mcp", "automation"]
categories = ["gui", "development-tools"]

[workspace.dependencies]
rust-use-core = { path = "crates/rust-use-core", version = "0.1.1" }
rust-use-macros = { path = "crates/rust-use-macros", version = "0.1.1" }
rust-use-agent = { path = "crates/rust-use-agent", version = "0.1.1" }
rust-use-gpui = { path = "crates/rust-use-gpui", version = "0.1.1" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
trybuild = "1"
insta = "1"
heck = "0.5"
clap = { version = "4", features = ["derive"] }
gpui = "0.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
# Its suggested rewrite (`assert_eq!(v, [] as [T; 0])`) reads worse than `assert!(v.is_empty())`.
assert_is_empty = "allow"

# Dependencies (gpui and its native stack in particular) are huge with full debug info. Keep
# line tables for our own crates' backtraces and drop debug info for everything else; this cuts
# a debug build of the workspace by more than half.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
