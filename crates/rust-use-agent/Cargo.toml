[package]
name = "rust-use-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The agent bridge for rust-use: compact snapshots, batched actions, queries and permissions."

[features]
ipc = ["dep:interprocess", "dep:rustix"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"], optional = true }

[dependencies]
interprocess = { version = "2", optional = true }
rust-use-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
