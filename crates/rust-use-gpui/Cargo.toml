[package]
name = "rust-use-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "GPUI adapter for rust-use."

[package.metadata.docs.rs]
all-features = true

[dependencies]
rust-use-core.workspace = true
rust-use-agent.workspace = true
gpui.workspace = true

[features]
default = ["runtime-shaders"]
# Compile GPUI's Metal shaders at startup instead of at build time, so building on macOS does
# not need Xcode's separate Metal Toolchain download. Disable default features to precompile.
runtime-shaders = ["gpui/runtime_shaders"]

[lints]
workspace = true
