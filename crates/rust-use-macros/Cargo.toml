[package]
name = "rust-use-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Derive and attribute macros for rust-use."
# The trybuild tests need the path-only rust-use-core dev-dependency stripped by cargo package.
exclude = ["tests/*"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
proc-macro-crate.workspace = true
heck.workspace = true

[dev-dependencies]
# Path-only so `cargo package` strips it before the core crate is on crates.io.
rust-use-core = { path = "../rust-use-core" }
trybuild.workspace = true
