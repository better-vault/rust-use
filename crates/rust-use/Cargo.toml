[package]
name = "rust-use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A library of behaviors for agents to build and drive the next generation of user interfaces."
readme = "../../README.md"

# With the `tauri` feature, build.rs forwards rust-use-tauri's permission files under this links
# name, so tauri-build registers the plugin's permissions for apps that depend on the facade alone.
links = "rust-use"

[lib]
name = "rust_use"

[package.metadata.docs.rs]
all-features = true

[dependencies]
gpui = { workspace = true, optional = true }
serde_json.workspace = true
rust-use-core.workspace = true
rust-use-macros = { workspace = true, optional = true }
rust-use-agent = { workspace = true, optional = true }
rust-use-gpui = { workspace = true, optional = true }

rust-use-tauri = { workspace = true, optional = true }

[features]
default = ["macros", "agent"]
macros = ["dep:rust-use-macros"]
agent = ["dep:rust-use-agent"]
gpui = ["agent", "macros", "dep:gpui", "dep:rust-use-gpui"]
tauri = ["agent", "dep:rust-use-tauri"]
ipc = ["agent", "rust-use-agent/ipc", "rust-use-tauri?/ipc"]
mcp = ["agent", "rust-use-agent/mcp"]

[[example]]
name = "agent_tour"
required-features = ["macros", "agent"]
test = true

[[example]]
name = "gpui_counter"
required-features = ["gpui"]

[lints]
workspace = true
