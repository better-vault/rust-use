[graph]
all-features = false

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # OSI-approved; reaches us through gpui -> image -> rav1e -> libfuzzer-sys.
    "NCSA",
]
confidence-threshold = 0.8

[bans]
# GPUI's dependency tree carries many duplicate versions we cannot resolve from here.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
